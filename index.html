<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAMP SCALE — LINEスタンプ用AIアップスケーラー</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@upscalerjs/esrgan-medium@1.0.0-beta.13/dist/umd/index.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upscaler@1.0.0-beta.19/dist/browser/umd/upscaler.min.js"></script>
<style>
  :root {
    --bg: #0d0d0f;
    --surface: #16161a;
    --border: #2a2a30;
    --accent: #00e5a0;
    --accent2: #ff6b6b;
    --text: #f0f0f0;
    --muted: #888;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }
  .wrapper { position: relative; z-index: 1; width: 100%; max-width: 800px; }
  header { text-align: center; margin-bottom: 48px; }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 6vw, 4rem);
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .logo span { color: var(--accent); }
  .tagline { margin-top: 10px; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }

  /* AI Loading banner */
  .ai-banner {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
  }
  .ai-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .ai-dot.loading { background: #f0c040; animation: pulse 1s infinite; }
  .ai-dot.ready { background: var(--accent); }
  .ai-dot.error { background: var(--accent2); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .ai-label { color: var(--muted); }
  .ai-label strong { color: var(--text); }

  /* Drop zone */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .drop-zone::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,229,160,0.05) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); }
  .drop-zone:hover::after, .drop-zone.drag-over::after { opacity: 1; }
  .drop-icon { font-size: 3rem; margin-bottom: 16px; display: block; animation: float 3s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .drop-text { font-size: 1rem; color: var(--muted); }
  .drop-text strong { color: var(--accent); font-weight: 700; }
  #fileInput { display: none; }

  /* Settings */
  .settings { margin-top: 32px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; display: none; }
  .settings.visible { display: block; }
  .settings-title { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; }
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .preset-btn {
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 12px; color: var(--text); cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif; transition: border-color 0.2s, background 0.2s; text-align: left;
  }
  .preset-btn:hover { border-color: var(--accent); }
  .preset-btn.active { border-color: var(--accent); background: rgba(0,229,160,0.08); }
  .preset-label { font-size: 0.7rem; color: var(--accent); font-family: 'Syne', sans-serif; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .preset-size { font-size: 1.1rem; font-family: 'Syne', sans-serif; font-weight: 700; }
  .preset-desc { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .custom-row { display: flex; gap: 10px; align-items: center; }
  .custom-row label { font-size: 0.8rem; color: var(--muted); white-space: nowrap; }
  .custom-row input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; color: var(--text); font-family: 'Syne', sans-serif;
    font-size: 0.9rem; width: 90px; transition: border-color 0.2s;
  }
  .custom-row input:focus { outline: none; border-color: var(--accent); }

  /* Preview */
  .preview-area { margin-top: 32px; display: none; }
  .preview-area.visible { display: block; }
  .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .preview-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; text-align: center; }
  .preview-card-label { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-family: 'Syne', sans-serif; font-weight: 700; margin-bottom: 14px; }
  .preview-img-wrap {
    display: flex; align-items: center; justify-content: center;
    min-height: 160px;
    background: repeating-conic-gradient(#1e1e22 0% 25%, #16161a 0% 50%) 0 0 / 16px 16px;
    border-radius: 8px; overflow: hidden; margin-bottom: 12px;
  }
  .preview-img-wrap img, .preview-img-wrap canvas { max-width: 100%; max-height: 200px; object-fit: contain; display: block; }
  .preview-info { font-size: 0.8rem; color: var(--muted); }
  .preview-info strong { color: var(--text); font-family: 'Syne', sans-serif; }

  /* Processing overlay */
  .processing-overlay {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    min-height: 160px;
  }
  .processing-overlay.visible { display: flex; }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing-text { font-size: 0.82rem; color: var(--accent); font-family: 'Syne', sans-serif; }

  /* Action */
  .action-row { margin-top: 24px; display: flex; gap: 12px; align-items: center; }
  .btn-primary {
    background: var(--accent); color: #000; border: none; border-radius: 10px;
    padding: 14px 32px; font-family: 'Syne', sans-serif; font-weight: 700;
    font-size: 0.95rem; cursor: pointer; letter-spacing: 0.04em;
    transition: transform 0.15s, box-shadow 0.15s; flex: 1;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,229,160,0.3); }
  .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
  .btn-secondary {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 20px; font-family: 'Syne', sans-serif;
    font-size: 0.85rem; cursor: pointer; transition: border-color 0.2s, color 0.2s;
  }
  .btn-secondary:hover { border-color: var(--accent2); color: var(--accent2); }

  /* Status */
  .status-bar { margin-top: 20px; padding: 12px 16px; border-radius: 10px; font-size: 0.82rem; display: none; }
  .status-bar.success { background: rgba(0,229,160,0.1); border: 1px solid rgba(0,229,160,0.3); color: var(--accent); display: block; }
  .status-bar.warning { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--accent2); display: block; }

  footer { margin-top: 60px; text-align: center; color: var(--muted); font-size: 0.75rem; opacity: 0.5; }

  @media (max-width: 480px) {
    .preview-grid { grid-template-columns: 1fr; }
    .preset-grid { grid-template-columns: 1fr 1fr; }
    .custom-row { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo">STAMP<span>SCALE</span></div>
    <p class="tagline">LINEスタンプ用 AIアップスケーラー</p>
  </header>

  <!-- AI Status -->
  <div class="ai-banner">
    <div class="ai-dot loading" id="aiDot"></div>
    <div class="ai-label" id="aiLabel"><strong>AI モデル</strong>を読み込み中…（初回のみ時間がかかります）</div>
  </div>

  <!-- Drop Zone -->
  <div class="drop-zone" id="dropZone">
    <span class="drop-icon">🖼️</span>
    <div class="drop-text">
      <strong>クリックまたはドラッグ</strong>で画像をアップロード<br>
      PNG / JPEG / GIF / WebP 対応
    </div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <!-- Settings -->
  <div class="settings" id="settings">
    <div class="settings-title">📐 出力サイズを選択</div>
    <div class="preset-grid">
      <button class="preset-btn active" data-w="370" data-h="320">
        <span class="preset-label">メインスタンプ</span>
        <span class="preset-size">370 × 320</span>
        <span class="preset-desc">標準スタンプ（必須）</span>
      </button>
      <button class="preset-btn" data-w="240" data-h="240">
        <span class="preset-label">スタンプキー画像</span>
        <span class="preset-size">240 × 240</span>
        <span class="preset-desc">ショップ一覧表示用</span>
      </button>
      <button class="preset-btn" data-w="96" data-h="74">
        <span class="preset-label">トークアイコン</span>
        <span class="preset-size">96 × 74</span>
        <span class="preset-desc">トーク画面小表示</span>
      </button>
      <button class="preset-btn" data-w="0" data-h="0">
        <span class="preset-label">カスタム</span>
        <span class="preset-size">自由設定</span>
        <span class="preset-desc">任意のサイズ</span>
      </button>
    </div>
    <div class="custom-row" id="customRow" style="display:none">
      <label>W</label>
      <input type="number" id="customW" placeholder="370" value="370" min="1" max="4000">
      <label>H</label>
      <input type="number" id="customH" placeholder="320" value="320" min="1" max="4000">
      <label>px</label>
    </div>
  </div>

  <!-- Preview -->
  <div class="preview-area" id="previewArea">
    <div class="preview-grid">
      <div class="preview-card">
        <div class="preview-card-label">元画像</div>
        <div class="preview-img-wrap">
          <img id="originalPreview" src="" alt="original">
        </div>
        <div class="preview-info" id="originalInfo">—</div>
      </div>
      <div class="preview-card">
        <div class="preview-card-label">AI処理後</div>
        <div class="preview-img-wrap" id="outputWrap">
          <div class="processing-overlay" id="processingOverlay">
            <div class="spinner"></div>
            <div class="processing-text" id="processingText">AI処理中…</div>
          </div>
          <canvas id="outputCanvas" style="display:none"></canvas>
        </div>
        <div class="preview-info" id="outputInfo">—</div>
      </div>
    </div>

    <div class="action-row">
      <button class="btn-primary" id="downloadBtn" onclick="downloadImage()" disabled>⬇ PNGダウンロード</button>
      <button class="btn-secondary" onclick="resetAll()">リセット</button>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </div>

  <footer>画像はすべてブラウザ内で処理されます。サーバーへの送信なし。</footer>
</div>

<canvas id="processingCanvas" style="display:none"></canvas>

<script>
  let currentFile = null;
  let currentImg = null;
  let targetW = 370, targetH = 320;
  let upscaler = null;
  let aiReady = false;
  let outputBlob = null;

  // UpscalerJS 初期化
  async function initAI() {
    try {
      upscaler = new Upscaler({ model: ESRGANMedium });
      // ウォームアップ
      await upscaler.warmup([{ patchSize: 64, padding: 2 }]);
      aiReady = true;
      document.getElementById('aiDot').className = 'ai-dot ready';
      document.getElementById('aiLabel').innerHTML = '<strong>AI モデル</strong> 準備完了 — ESRGANイラスト超解像';
    } catch(e) {
      document.getElementById('aiDot').className = 'ai-dot error';
      document.getElementById('aiLabel').innerHTML = '<strong>AI モデル</strong> 読み込み失敗 — 標準リサイズで動作します';
      console.warn('Upscaler init failed:', e);
    }
  }
  initAI();

  // Drop zone
  const dropZone = document.getElementById('dropZone');
  const fileInput = document.getElementById('fileInput');
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) loadFile(file);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  function loadFile(file) {
    currentFile = file;
    outputBlob = null;
    document.getElementById('downloadBtn').disabled = true;
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      currentImg = img;
      document.getElementById('originalPreview').src = url;
      const kb = (file.size / 1024).toFixed(1);
      document.getElementById('originalInfo').innerHTML =
        `<strong>${img.naturalWidth} × ${img.naturalHeight}px</strong> / ${kb}KB`;
      document.getElementById('settings').classList.add('visible');
      document.getElementById('previewArea').classList.add('visible');
      processImage();
    };
    img.src = url;
  }

  // Presets
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const w = parseInt(btn.dataset.w), h = parseInt(btn.dataset.h);
      const customRow = document.getElementById('customRow');
      if (w === 0) {
        customRow.style.display = 'flex';
        targetW = parseInt(document.getElementById('customW').value) || 370;
        targetH = parseInt(document.getElementById('customH').value) || 320;
      } else {
        customRow.style.display = 'none';
        targetW = w; targetH = h;
      }
      if (currentImg) processImage();
    });
  });
  document.getElementById('customW').addEventListener('input', e => { targetW = parseInt(e.target.value)||370; if(currentImg) processImage(); });
  document.getElementById('customH').addEventListener('input', e => { targetH = parseInt(e.target.value)||320; if(currentImg) processImage(); });

  // メイン処理
  async function processImage() {
    if (!currentImg) return;
    outputBlob = null;
    document.getElementById('downloadBtn').disabled = true;

    // スピナー表示
    const overlay = document.getElementById('processingOverlay');
    const outCanvas = document.getElementById('outputCanvas');
    overlay.classList.add('visible');
    outCanvas.style.display = 'none';
    document.getElementById('outputInfo').innerHTML = '—';

    try {
      let upscaledCanvas;

      if (aiReady && upscaler) {
        document.getElementById('processingText').textContent = 'AI超解像処理中…';
        // UpscalerJS でアップスケール
        const result = await upscaler.upscale(currentImg, {
          output: 'canvas',
          patchSize: 64,
          padding: 2,
        });
        upscaledCanvas = result;
      } else {
        // フォールバック: 段階的リサイズ
        document.getElementById('processingText').textContent = 'リサイズ中…';
        upscaledCanvas = steppedUpscale(currentImg, currentImg.naturalWidth * 2, currentImg.naturalHeight * 2);
      }

      // 縦横比を維持してターゲットサイズに収める（透明背景）
      const finalCanvas = fitToCanvas(upscaledCanvas, targetW, targetH);

      // プレビュー表示
      const maxDisplay = 200;
      const scale = Math.min(maxDisplay / targetW, maxDisplay / targetH, 1);
      outCanvas.width = Math.round(targetW * scale);
      outCanvas.height = Math.round(targetH * scale);
      outCanvas.getContext('2d').drawImage(finalCanvas, 0, 0, outCanvas.width, outCanvas.height);
      outCanvas.style.display = 'block';

      // 処理用キャンバスに保存
      const proc = document.getElementById('processingCanvas');
      proc.width = targetW; proc.height = targetH;
      proc.getContext('2d').drawImage(finalCanvas, 0, 0);

      // BlobをキャッシュしてDL用に
      proc.toBlob(blob => {
        outputBlob = blob;
        const kb = (blob.size / 1024).toFixed(1);
        const warn = blob.size > 1024 * 1024;
        document.getElementById('outputInfo').innerHTML =
          `<strong>${targetW} × ${targetH}px</strong> / 約${kb}KB${warn ? ' <span style="color:var(--accent2)">⚠ 1MB超</span>' : ''}`;
        const bar = document.getElementById('statusBar');
        bar.className = warn ? 'status-bar warning' : 'status-bar success';
        bar.textContent = warn
          ? '⚠ ファイルサイズが1MBを超えています。LINEスタンプの上限は1MBです。'
          : '✓ LINEスタンプのサイズ要件を満たしています。';
        document.getElementById('downloadBtn').disabled = false;
      }, 'image/png');

    } catch(err) {
      console.error(err);
      document.getElementById('processingText').textContent = 'エラーが発生しました';
    } finally {
      overlay.classList.remove('visible');
    }
  }

  // 縦横比維持・透明背景でフィット
  function fitToCanvas(src, destW, destH) {
    const canvas = document.createElement('canvas');
    canvas.width = destW;
    canvas.height = destH;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, destW, destH); // 透明背景

    const srcW = src.width || src.naturalWidth;
    const srcH = src.height || src.naturalHeight;
    const scale = Math.min(destW / srcW, destH / srcH);
    const drawW = Math.round(srcW * scale);
    const drawH = Math.round(srcH * scale);
    const offsetX = Math.round((destW - drawW) / 2);
    const offsetY = Math.round((destH - drawH) / 2);

    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(src, offsetX, offsetY, drawW, drawH);
    return canvas;
  }

  // フォールバック: 段階的アップスケール
  function steppedUpscale(img, destW, destH) {
    let srcW = img.naturalWidth, srcH = img.naturalHeight;
    let canvas = document.createElement('canvas');
    canvas.width = srcW; canvas.height = srcH;
    canvas.getContext('2d').drawImage(img, 0, 0);
    while (srcW < destW * 0.9 || srcH < destH * 0.9) {
      const nextW = Math.min(Math.round(srcW * 1.5), destW * 2);
      const nextH = Math.min(Math.round(srcH * 1.5), destH * 2);
      const next = document.createElement('canvas');
      next.width = nextW; next.height = nextH;
      const nctx = next.getContext('2d');
      nctx.imageSmoothingEnabled = true;
      nctx.imageSmoothingQuality = 'high';
      nctx.drawImage(canvas, 0, 0, nextW, nextH);
      canvas = next; srcW = nextW; srcH = nextH;
      if (srcW >= destW && srcH >= destH) break;
    }
    return canvas;
  }

  function downloadImage() {
    if (!outputBlob) return;
    const url = URL.createObjectURL(outputBlob);
    const a = document.createElement('a');
    const base = currentFile.name.replace(/\.[^.]+$/, '');
    a.download = `${base}_${targetW}x${targetH}.png`;
    a.href = url;
    a.click();
    URL.revokeObjectURL(url);
  }

  function resetAll() {
    currentFile = null; currentImg = null; outputBlob = null;
    document.getElementById('fileInput').value = '';
    document.getElementById('originalPreview').src = '';
    document.getElementById('settings').classList.remove('visible');
    document.getElementById('previewArea').classList.remove('visible');
    document.getElementById('statusBar').className = 'status-bar';
    document.getElementById('downloadBtn').disabled = true;
    document.getElementById('outputCanvas').style.display = 'none';
  }
</script>
</body>
</html>
